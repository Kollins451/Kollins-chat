<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="theme-color"
content="#075e54"
>

<title>
Kollins Chat
</title>

<link
rel="stylesheet"
href="style.css"
>

</head>


<body class="chat-page">


<div class="chat-app">


<aside class="chat-sidebar">


<div class="chat-header">


<div>

<h2>
Kollins Chat
</h2>


<p id="myUsername">
</p>

</div>


<button
id="logoutBtn"
class="logout-button"
>
Logout
</button>


</div>


<div class="contacts-title">


<h3>
Chats
</h3>


<button
id="addFriendBtn"
class="add-friend-button"
>
+
</button>


</div>


<div
id="addFriendBox"
class="add-friend-box"
style="display: none;"
>


<input
type="tel"
id="friendPhone"
placeholder="Enter friend's phone number"
>


<button
id="addFriendSubmit"
>
Add
</button>


<p
id="addFriendMessage"
>
</p>


</div>


<div
id="contactsList"
class="contacts-list"
>

<p class="empty-contacts">
No chats yet.
Tap + to add a friend.
</p>

</div>


</aside>


<main class="chat-main">


<div
id="emptyChat"
class="empty-chat"
>


<div class="chat-logo">
💬
</div>


<h2>
Welcome to Kollins Chat
</h2>


<p>
Add a friend using their registered phone number to start chatting.
</p>


</div>


<div
id="activeChat"
class="active-chat"
style="display: none;"
>


<div class="conversation-header">


<div>

<h3
id="chatUserName"
>
User
</h3>


<p
id="chatUserUsername"
>
</p>

</div>


</div>


<div
id="messagesContainer"
class="messages-container"
>
</div>


<form
id="messageForm"
class="message-form"
>


<input
type="text"
id="messageInput"
placeholder="Type a message..."
autocomplete="off"
required
>


<button
type="submit"
>
Send
</button>


</form>


</div>


</main>


</div>


<script src="script.js"></script>


</body>

</html>
