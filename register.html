<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="theme-color"
content="#075e54"
>

<title>
Create Account - Kollins Chat
</title>

<link
rel="stylesheet"
href="style.css"
>

</head>


<body class="auth-page">


<div class="auth-container">


<div class="auth-logo">
💬
</div>


<h1>
Create Your Account
</h1>


<p class="auth-subtitle">
Join Kollins Chat and connect with friends.
</p>


<form id="registerForm">


<label for="fullName">
Full Name
</label>


<input
type="text"
id="fullName"
placeholder="Enter your full name"
required
>


<label for="username">
Username
</label>


<input
type="text"
id="username"
placeholder="Choose a username"
required
>


<label for="phoneNumber">
Phone Number
</label>


<input
type="tel"
id="phoneNumber"
placeholder="Enter your phone number"
required
>


<label for="registerPassword">
Password
</label>


<input
type="password"
id="registerPassword"
placeholder="Create a password"
required
>


<label for="confirmPassword">
Confirm Password
</label>


<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
required
>


<button
type="submit"
class="auth-button"
>
Create Account
</button>


</form>


<p
id="registerMessage"
class="auth-message"
></p>


<p class="auth-switch">

Already have an account?

<a href="login.html">
Log In
</a>

</p>


</div>


<script src="script.js"></script>


</body>

</html>
