<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="theme-color"
content="#075e54"
>

<title>
Login - Kollins Chat
</title>

<link
rel="stylesheet"
href="style.css"
>

</head>


<body class="auth-page">


<div class="auth-container">


<!-- Logo -->

<div class="auth-logo">
💬
</div>


<!-- Title -->

<h1>
Welcome Back
</h1>


<p class="auth-subtitle">
Log in to continue to Kollins Chat
</p>


<!-- Login Form -->

<form id="loginForm">


<!-- Username or Phone -->

<label>
Phone Number or Username
</label>


<input
type="text"
id="loginIdentifier"
placeholder="Enter phone number or username"
required
>


<!-- Password -->

<label>
Password
</label>


<input
type="password"
id="loginPassword"
placeholder="Enter your password"
required
>


<!-- Login Button -->

<button
type="submit"
class="auth-button"
>
Log In
</button>


</form>


<!-- Login Message -->

<p
id="loginMessage"
class="auth-message"
></p>


<!-- Divider -->

<div class="auth-divider">
OR
</div>


<!-- Register Link -->

<p class="auth-switch">

Don't have an account?

<a href="register.html">
Create Account
</a>

</p>


</div>


<!-- JavaScript -->

<script src="script.js"></script>


</body>

</html>
