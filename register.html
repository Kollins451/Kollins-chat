<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="theme-color"
content="#075e54"
>

<title>
Create Account - Kollins Chat
</title>

<link
rel="stylesheet"
href="style.css"
>

</head>


<body class="auth-page">


<div class="auth-container">


<!-- Logo -->

<div class="auth-logo">
💬
</div>


<!-- Title -->

<h1>
Create Your Account
</h1>


<p class="auth-subtitle">
Join Kollins Chat and connect with people
</p>


<!-- Registration Form -->

<form id="registerForm">


<!-- Full Name -->

<label>
Full Name
</label>


<input
type="text"
id="fullName"
placeholder="Enter your full name"
required
>


<!-- Username -->

<label>
Username
</label>


<input
type="text"
id="username"
placeholder="@username"
required
>


<!-- Phone Number -->

<label>
Phone Number
</label>


<input
type="tel"
id="phoneNumber"
placeholder="Enter your phone number"
required
>


<!-- Password -->

<label>
Password
</label>


<input
type="password"
id="registerPassword"
placeholder="Create a password"
required
>


<!-- Confirm Password -->

<label>
Confirm Password
</label>


<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
required
>


<!-- Create Account Button -->

<button
type="submit"
class="auth-button"
>
Create Account
</button>


</form>


<!-- Registration Message -->

<p
id="registerMessage"
class="auth-message"
></p>


<!-- Divider -->

<div class="auth-divider">
OR
</div>


<!-- Login Link -->

<p class="auth-switch">

Already have an account?

<a href="login.html">
Log In
</a>

</p>


</div>


<!-- JavaScript -->

<script src="script.js"></script>


</body>

</html>
